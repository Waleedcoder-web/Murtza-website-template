<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>7v7 Performance Rashguard | Interactive 3D Orbital Showcase | Snowtop Sports</title>
  <meta name="description" content="Experience the Next-Gen 7v7 Compression Football Rashguard in an interactive 3D orbital showcase. 360-degree multi-angle views engineered for dominance.">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/assets/images/logo-icon.png">

  <!-- Google Fonts: Syncopate & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Syncopate:wght@700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <!-- Icons: FontAwesome 6 & Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Tailwind CSS CDN with Custom Dark Sports Theme -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            charcoal: {
              950: '#05070a',
              900: '#090d12',
              850: '#0e141c',
              800: '#131b26',
              700: '#1c2838'
            },
            emerald: {
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
              glow: '#00e676'
            },
            volt: {
              lime: '#ccff00',
              electric: '#84cc16'
            }
          },
          fontFamily: {
            sans: ['Outfit', 'Inter', 'system-ui', 'sans-serif'],
            display: ['Syncopate', 'Outfit', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']

          animation: {
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'float-slow': 'float 6s ease-in-out infinite'
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-8px)' }
            }
          }
        }
      }
    };
  </script>

  <!-- React 18, ReactDOM & Babel for modern Component Architecture -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Three.js (r128) & GSAP for Ultra-Smooth 60fps 3D Math -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <style>
    /* Custom Scrollbar & Selection */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #05070a; }
    ::-webkit-scrollbar-thumb { background: #131b26; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #10b981; }
    ::selection { background: #10b981; color: #000; }

    /* Vignette & Ambient Radial Glow Background */
    .hero-radial-bg {
      background: radial-gradient(circle at 75% 45%, rgba(16, 185, 129, 0.12) 0%, rgba(9, 13, 18, 0.7) 45%, #05070a 85%);
    }

    /* Subtle Technical Grid Lines */
    .cyber-grid {
      background-size: 40px 40px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
    }

    /* Glassmorphic Panel Styles */
    .glass-card {
      background: rgba(14, 20, 28, 0.72);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.07);
    }
    .glass-card:hover {
      border-color: rgba(16, 185, 129, 0.35);
    }

    /* 3D Canvas wrapper */
    #canvas-container {
      cursor: grab;
      touch-action: none;
    }
    #canvas-container:active {
      cursor: grabbing;
    }
  </style>
</head>
<body class="bg-charcoal-950 text-slate-100 font-sans antialiased overflow-x-hidden min-h-screen selection:bg-emerald-500 selection:text-black">

  <div id="root"></div>

  <!-- React 3D Showcase Script -->
  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    // View metadata matching the 6 rashguard camera angles
    const RASHGUARD_VIEWS = [
      {
        id: 0,
        name: "Front View",
        shortCode: "01",
        label: "AERO-CHEST & TORSO",
        desc: "High-flex ergonomic emerald compression body with aerodynamic volt-lime velocity vectors and reinforced collar.",
        img: "/assets/images/rashguard_3d/front.jpg",
        flipX: false
      },
      {
        id: 1,
        name: "Front 45° Angle",
        shortCode: "02",
        label: "DYNAMIC SHOULDER CONTOUR",
        desc: "Raglan shoulder cut and anatomic flatlock seam placement providing 360° rotational reach for receivers.",
        img: "/assets/images/rashguard_3d/front-45.png",
        flipX: false
      },
      {
        id: 2,
        name: "Right Side Profile",
        shortCode: "03",
        label: "LATERAL VENTILATION MESH",
        desc: "Laser-perforated dark obsidian rib ventilation panel for active body heat dissipation under intense pressure.",
        img: "/assets/images/rashguard_3d/right.jpg",
        flipX: true // Mirrored texture for realistic right-side profile
      },
      {
        id: 3,
        name: "Back View",
        shortCode: "04",
        label: "CHAMPIONSHIP '07' NUMBERING",
        desc: "Bold zero-fade heat-sealed athletic lettering '07' flanked by dark obsidian shoulder cap yokes and lime safety accents.",
        img: "/assets/images/rashguard_3d/back.jpg",
        flipX: false
      },
      {
        id: 4,
        name: "Back 45° Angle",
        shortCode: "05",
        label: "SCAPULAR FLEX ZONE",
        desc: "Ergonomic compression contour designed to maintain posture, minimize muscle fatigue, and eliminate garment ride-up.",
        img: "/assets/images/rashguard_3d/back-45.png",
        flipX: false
      },
      {
        id: 5,
        name: "Left Side Profile",
        shortCode: "06",
        label: "FOUR-WAY KINETIC STRETCH",
        desc: "Full side profile showcasing seamless integration between compression top and reinforced quad shorts.",
        img: "/assets/images/rashguard_3d/left.jpg",
        flipX: false
      }
    ];

    // =========================================================================
    // 3D ORBITAL CAROUSEL THREE.JS COMPONENT
    // =========================================================================
    function RashguardOrbitalCanvas({ activeIndex, onSelectIndex, isAutoSpin, onToggleAutoSpin }) {
      const containerRef = useRef(null);
      const sceneRef = useRef(null);
      const rendererRef = useRef(null);
      const cameraRef = useRef(null);
      const planesGroupRef = useRef(null);
      const pedestalGroupRef = useRef(null);
      const meshesRef = useRef([]);

      // Angular state for rotation
      const stateRef = useRef({
        targetAngle: 0,
        currentAngle: 0,
        isDragging: false,
        startX: 0,
        lastX: 0,
        dragDistance: 0,
        dragVelocity: 0,
        mouseNormX: 0,
        mouseNormY: 0,
        autoSpinActive: isAutoSpin,
        lastInteractionTime: Date.now()
      });

      // Keep state in sync with props
      useEffect(() => {
        stateRef.current.autoSpinActive = isAutoSpin;
      }, [isAutoSpin]);

      // When activeIndex changes from buttons, smoothly animate targetAngle
      useEffect(() => {
        const step = (Math.PI * 2) / 6;
        // Target angle is negative so active view is facing front (angle 0)
        stateRef.current.targetAngle = -activeIndex * step;
        stateRef.current.lastInteractionTime = Date.now();
      }, [activeIndex]);

      // Initialize Three.js Scene
      useEffect(() => {
        const container = containerRef.current;
        if (!container) return;

        const width = container.clientWidth;
        const height = container.clientHeight;

        // 1. Scene
        const scene = new THREE.Scene();
        sceneRef.current = scene;

        // 2. Camera with cinematic focal length
        const camera = new THREE.PerspectiveCamera(38, width / height, 0.1, 100);
        camera.position.set(0, 0.15, 8.8);
        cameraRef.current = camera;

        // 3. High-Performance WebGL Renderer
        const renderer = new THREE.WebGLRenderer({
          alpha: true,
          antialias: true,
          powerPreference: "high-performance"
        });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.outputEncoding = THREE.sRGBEncoding;
        container.appendChild(renderer.domElement);
        rendererRef.current = renderer;

        // 4. Lighting Setup (Sportswear Studio Lighting)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
        scene.add(ambientLight);

        const keyLight = new THREE.DirectionalLight(0xffffff, 1.2);
        keyLight.position.set(4, 6, 7);
        scene.add(keyLight);

        const emeraldRimLight = new THREE.DirectionalLight(0x10b981, 1.8);
        emeraldRimLight.position.set(-6, 2, -3);
        scene.add(emeraldRimLight);

        const voltRimLight = new THREE.DirectionalLight(0xccff00, 1.4);
        voltRimLight.position.set(6, -2, -3);
        scene.add(voltRimLight);

        // 5. Glowing 3D Pedestal Platform on the Floor
        const pedestalGroup = new THREE.Group();
        pedestalGroup.position.set(0, -2.6, 0);

        // A. Disc Platform
        const discGeo = new THREE.CylinderGeometry(2.8, 2.9, 0.08, 48);
        const discMat = new THREE.MeshStandardMaterial({
          color: 0x090d12,
          roughness: 0.4,
          metalness: 0.8
        });
        const discMesh = new THREE.Mesh(discGeo, discMat);
        pedestalGroup.add(discMesh);

        // B. Outer Neon Ring
        const ringGeo1 = new THREE.RingGeometry(2.95, 3.02, 64);
        const ringMat1 = new THREE.MeshBasicMaterial({
          color: 0x10b981,
          side: THREE.DoubleSide
        });
        const ringMesh1 = new THREE.Mesh(ringGeo1, ringMat1);
        ringMesh1.rotation.x = -Math.PI / 2;
        ringMesh1.position.y = 0.05;
        pedestalGroup.add(ringMesh1);

        // C. Inner Dashed Ring
        const ringGeo2 = new THREE.RingGeometry(2.35, 2.4, 48);
        const ringMat2 = new THREE.MeshBasicMaterial({
          color: 0xccff00,
          side: THREE.DoubleSide
        });
        const ringMesh2 = new THREE.Mesh(ringGeo2, ringMat2);
        ringMesh2.rotation.x = -Math.PI / 2;
        ringMesh2.position.y = 0.055;
        pedestalGroup.add(ringMesh2);

        // D. Soft Emerald Ambient Floor Shadow / Glow
        const canvasGlow = document.createElement('canvas');
        canvasGlow.width = 256;
        canvasGlow.height = 256;
        const ctxGlow = canvasGlow.getContext('2d');
        const grad = ctxGlow.createRadialGradient(128, 128, 20, 128, 128, 120);
        grad.addColorStop(0, 'rgba(16, 185, 129, 0.45)');
        grad.addColorStop(0.5, 'rgba(16, 185, 129, 0.12)');
        grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctxGlow.fillStyle = grad;
        ctxGlow.fillRect(0, 0, 256, 256);

        const glowTexture = new THREE.CanvasTexture(canvasGlow);
        const shadowPlaneGeo = new THREE.PlaneGeometry(6.5, 6.5);
        const shadowPlaneMat = new THREE.MeshBasicMaterial({
          map: glowTexture,
          transparent: true,
          depthWrite: false
        });
        const shadowPlane = new THREE.Mesh(shadowPlaneGeo, shadowPlaneMat);
        shadowPlane.rotation.x = -Math.PI / 2;
        shadowPlane.position.y = 0.02;
        pedestalGroup.add(shadowPlane);

        scene.add(pedestalGroup);
        pedestalGroupRef.current = pedestalGroup;

        // 6. Orbital Carousel Group holding 6 Textured Planes
        const planesGroup = new THREE.Group();
        scene.add(planesGroup);
        planesGroupRef.current = planesGroup;

        // Texture Loader
        const textureLoader = new THREE.TextureLoader();
        const meshes = [];
        const orbitRadius = 3.35; // Orbital circle radius
        const planeWidth = 2.45;
        const planeHeight = 4.35; // Proportion matched to 756 x 1344 rashguard ratio
        const planeGeo = new THREE.PlaneGeometry(planeWidth, planeHeight);

        RASHGUARD_VIEWS.forEach((view, idx) => {
          const texture = textureLoader.load(view.img);
          texture.generateMipmaps = true;
          texture.minFilter = THREE.LinearMipmapLinearFilter;
          texture.magFilter = THREE.LinearFilter;

          if (view.flipX) {
            texture.repeat.x = -1;
            texture.offset.x = 1;
          }

          // Double-sided transparent material with smooth depth blending
          const material = new THREE.MeshBasicMaterial({
            map: texture,
            transparent: true,
            side: THREE.DoubleSide,
            depthWrite: false
          });

          const mesh = new THREE.Mesh(planeGeo, material);
          mesh.userData = { index: idx, viewName: view.name };

          planesGroup.add(mesh);
          meshes.push(mesh);
        });
        meshesRef.current = meshes;

        // 7. Raycaster for 1-Click Jumping to Any Plane in 3D
        const raycaster = new THREE.Raycaster();
        const mouseVec = new THREE.Vector2();

        const handlePointerDown = (e) => {
          const clientX = e.touches ? e.touches[0].clientX : e.clientX;
          stateRef.current.isDragging = true;
          stateRef.current.startX = clientX;
          stateRef.current.lastX = clientX;
          stateRef.current.dragDistance = 0;
          stateRef.current.dragVelocity = 0;
          stateRef.current.lastInteractionTime = Date.now();
        };

        const handlePointerMove = (e) => {
          const clientX = e.touches ? e.touches[0].clientX : e.clientX;
          const rect = container.getBoundingClientRect();
          const pageX = e.touches ? e.touches[0].clientX : e.clientX;
          const pageY = e.touches ? e.touches[0].clientY : e.clientY;

          // Mouse coordinates for subtle camera parallax
          stateRef.current.mouseNormX = ((pageX - rect.left) / rect.width - 0.5) * 2;
          stateRef.current.mouseNormY = ((pageY - rect.top) / rect.height - 0.5) * 2;

          if (stateRef.current.isDragging) {
            const deltaX = clientX - stateRef.current.lastX;
            stateRef.current.lastX = clientX;
            stateRef.current.dragDistance += Math.abs(deltaX);

            // Drag sensitivity: maps pixel swipe to radian rotation
            const sensitivity = 0.0055;
            stateRef.current.targetAngle += deltaX * sensitivity;
            stateRef.current.dragVelocity = deltaX * sensitivity;
            stateRef.current.lastInteractionTime = Date.now();
          }
        };

        const handlePointerUp = (e) => {
          if (!stateRef.current.isDragging) return;
          stateRef.current.isDragging = false;
          stateRef.current.lastInteractionTime = Date.now();

          // If it was a quick click rather than a drag, raycast to click-select planes
          if (stateRef.current.dragDistance < 8 && !e.touches) {
            const rect = container.getBoundingClientRect();
            mouseVec.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            mouseVec.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouseVec, camera);
            const intersects = raycaster.intersectObjects(meshes);

            if (intersects.length > 0) {
              const clickedIdx = intersects[0].object.userData.index;
              onSelectIndex(clickedIdx);
              return;
            }
          }

          // Snap to the closest item index when user lets go of drag
          const step = (Math.PI * 2) / 6;
          // Projected angle with inertia velocity
          const projectedAngle = stateRef.current.targetAngle + stateRef.current.dragVelocity * 8;
          let snapIndex = Math.round(-projectedAngle / step) % 6;
          if (snapIndex < 0) snapIndex += 6;

          onSelectIndex(snapIndex);
        };

        container.addEventListener('mousedown', handlePointerDown);
        window.addEventListener('mousemove', handlePointerMove);
        window.addEventListener('mouseup', handlePointerUp);

        container.addEventListener('touchstart', handlePointerDown, { passive: true });
        window.addEventListener('touchmove', handlePointerMove, { passive: true });
        window.addEventListener('touchend', handlePointerUp);

        // 8. Responsive Resize Handler
        const handleResize = () => {
          if (!container || !camera || !renderer) return;
          const w = container.clientWidth;
          const h = container.clientHeight;
          camera.aspect = w / h;

          // Adapt camera distance on mobile phones vs desktop monitors
          if (w < 640) {
            camera.position.z = 10.5;
          } else if (w < 1024) {
            camera.position.z = 9.4;
          } else {
            camera.position.z = 8.8;
          }

          camera.updateProjectionMatrix();
          renderer.setSize(w, h);
        };
        handleResize();
        window.addEventListener('resize', handleResize);

        // 9. 60 FPS Render Loop with Depth Scaling & Orbital Math
        let animationFrameId;
        const totalCards = 6;
        const angleStep = (Math.PI * 2) / totalCards;

        const animate = () => {
          animationFrameId = requestAnimationFrame(animate);

          // Auto-rotation when not dragging and auto-spin is ON
          const idleTime = Date.now() - stateRef.current.lastInteractionTime;
          if (stateRef.current.autoSpinActive && !stateRef.current.isDragging && idleTime > 1500) {
            stateRef.current.targetAngle -= 0.0035; // gentle continuous rotation
          }

          // Smooth lerp damping to targetAngle
          stateRef.current.currentAngle += (stateRef.current.targetAngle - stateRef.current.currentAngle) * 0.085;

          // Subtle Mouse Parallax on Camera
          camera.position.x += (stateRef.current.mouseNormX * 0.45 - camera.position.x) * 0.05;
          camera.position.y += (-stateRef.current.mouseNormY * 0.35 + 0.15 - camera.position.y) * 0.05;
          camera.lookAt(0, 0, 0);

          // Rotate the glowing pedestal rings slowly for futuristic depth
          if (ringMesh1) ringMesh1.rotation.z += 0.005;
          if (ringMesh2) ringMesh2.rotation.z -= 0.007;

          // Position each card along the 3D circular orbit
          const curAngle = stateRef.current.currentAngle;

          meshes.forEach((mesh, idx) => {
            // Angle around the circle
            const theta = idx * angleStep + curAngle;

            // Coordinates on orbital cylinder (X and Z)
            const x = Math.sin(theta) * orbitRadius;
            const z = Math.cos(theta) * orbitRadius;

            mesh.position.set(x, 0.1, z);

            // Plane faces the camera to maintain crystal clear apparel view
            mesh.lookAt(camera.position.x, mesh.position.y, camera.position.z);

            // Depth calculation: 1.0 (Front) down to 0.0 (Back)
            const normalizedZ = (z + orbitRadius) / (2 * orbitRadius); // 0 to 1

            // Dynamic depth scale: Front card appears large & crisp, back cards recede
            const scale = 0.62 + 0.42 * normalizedZ;
            mesh.scale.set(scale, scale, 1);

            // Dynamic opacity & depth fade
            mesh.material.opacity = 0.28 + 0.72 * Math.pow(normalizedZ, 1.4);

            // Higher renderOrder for front-most planes to avoid clipping
            mesh.renderOrder = Math.round(normalizedZ * 100);
          });

          renderer.render(scene, camera);
        };
        animate();

        // Cleanup on unmount
        return () => {
          cancelAnimationFrame(animationFrameId);
          window.removeEventListener('resize', handleResize);
          container.removeEventListener('mousedown', handlePointerDown);
          window.removeEventListener('mousemove', handlePointerMove);
          window.removeEventListener('mouseup', handlePointerUp);
          container.removeEventListener('touchstart', handlePointerDown);
          window.removeEventListener('touchmove', handlePointerMove);
          window.removeEventListener('touchend', handlePointerUp);

          if (renderer && renderer.domElement && container.contains(renderer.domElement)) {
            container.removeChild(renderer.domElement);
          }
          renderer.dispose();
        };
      }, [onSelectIndex]);

      return (
        <div className="relative w-full h-[540px] sm:h-[620px] lg:h-[720px] select-none flex items-center justify-center">
          {/* 3D WebGL Canvas Viewport */}
          <div ref={containerRef} id="canvas-container" className="w-full h-full relative z-10" />

          {/* Radial Emerald Glow Backdrop Behind 3D Center */}
          <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[340px] sm:w-[480px] h-[340px] sm:h-[480px] bg-emerald-500/15 rounded-full blur-[100px] pointer-events-none z-0" />

          {/* Interactive Floating Drag Guide Pill */}
          <div className="absolute bottom-4 sm:bottom-6 left-1/2 -translate-x-1/2 z-20 flex items-center gap-3 px-4 py-2 rounded-full glass-card border border-white/10 shadow-2xl text-xs text-slate-300 font-medium pointer-events-auto">
            <span className="flex items-center gap-1.5 text-emerald-400">
              <i className="fa-solid fa-arrows-left-right text-sm"></i>
              <span>Drag to orbit 360°</span>
            </span>
            <span className="w-1 h-1 rounded-full bg-slate-600"></span>
            <button
              onClick={onToggleAutoSpin}
              className={`flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold transition-all ${
                isAutoSpin 
                  ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40' 
                  : 'bg-white/5 text-slate-400 hover:text-white border border-white/10'
              }`}
            >
              <i className={`fa-solid ${isAutoSpin ? 'fa-pause' : 'fa-play'} text-[10px]`}></i>
              <span>{isAutoSpin ? 'Orbit: ON' : 'Orbit: PAUSED'}</span>
            </button>
          </div>
        </div>
      );
    }

    // =========================================================================
    // MAIN SHOWCASE LANDING PAGE COMPONENT
    // =========================================================================
    function RashguardShowcaseApp() {
      const [activeIndex, setActiveIndex] = useState(0);
      const [isAutoSpin, setIsAutoSpin] = useState(true);
      const [isCopied, setIsCopied] = useState(false);

      const activeView = RASHGUARD_VIEWS[activeIndex];

      const handleNext = () => {
        setActiveIndex((prev) => (prev + 1) % RASHGUARD_VIEWS.length);
      };

      const handlePrev = () => {
        setActiveIndex((prev) => (prev - 1 + RASHGUARD_VIEWS.length) % RASHGUARD_VIEWS.length);
      };

      const handleToggleAutoSpin = () => {
        setIsAutoSpin((prev) => !prev);
      };

      // Keyboard arrow navigation
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'ArrowRight') handleNext();
          if (e.key === 'ArrowLeft') handlePrev();
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, []);

      const handleShare = () => {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(window.location.href);
          setIsCopied(true);
          setTimeout(() => setIsCopied(false), 2000);
        }
      };

      return (
        <div className="relative min-h-screen bg-charcoal-950 cyber-grid overflow-hidden flex flex-col justify-between">
          {/* Ambient Lighting Orbs */}
          <div className="absolute top-0 right-0 w-[600px] h-[600px] bg-emerald-500/10 rounded-full blur-[140px] pointer-events-none" />
          <div className="absolute bottom-0 left-0 w-[500px] h-[500px] bg-volt-lime/5 rounded-full blur-[140px] pointer-events-none" />

          {/* =============================================================== */}
          {/* 1. GLASSMORPHIC TOP NAVBAR */}
          {/* =============================================================== */}
          <header className="relative z-30 w-full border-b border-white/5 bg-charcoal-950/70 backdrop-blur-xl">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
              {/* Brand Logo */}
              <a href="/" className="flex items-center gap-3 group">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-600 via-emerald-500 to-volt-lime p-[1.5px] shadow-lg shadow-emerald-500/20 group-hover:shadow-emerald-500/40 transition-all">
                  <div className="w-full h-full bg-charcoal-950 rounded-[10px] flex items-center justify-center">
                    <span className="font-display font-black text-lg tracking-tighter text-white">S</span>
                  </div>
                </div>
                <div>
                  <div className="flex items-center gap-1.5">
                    <span className="font-display font-black tracking-wider text-base text-white">SNOWTOP</span>
                    <span className="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                    <span className="font-mono text-[10px] font-bold text-emerald-400 tracking-widest uppercase">LABS</span>
                  </div>
                  <span className="text-[10px] tracking-widest text-slate-400 uppercase font-semibold block -mt-0.5">3D Apparel Experience</span>
                </div>
              </a>

              {/* Navigation Center Links */}
              <nav className="hidden md:flex items-center gap-8 text-sm font-medium text-slate-300">
                <a href="/" className="hover:text-emerald-400 transition-colors flex items-center gap-1.5">
                  <i className="bi bi-arrow-left text-xs"></i> Storefront
                </a>
                <a href="/catalogue.html" className="hover:text-emerald-400 transition-colors">Catalogue</a>
                <a href="/customizer.html" className="hover:text-emerald-400 transition-colors">3D Customizer</a>
                <span className="px-3 py-1 rounded-full text-xs font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">
                  <i className="fa-solid fa-cube me-1"></i> Interactive Showcase
                </span>
              </nav>

              {/* Action Buttons */}
              <div className="flex items-center gap-3">
                <button
                  onClick={handleShare}
                  className="hidden sm:inline-flex items-center gap-2 px-3.5 py-1.5 rounded-xl glass-card text-xs font-semibold text-slate-300 hover:text-white transition-all"
                  title="Share 3D Experience"
                >
                  <i className={`bi ${isCopied ? 'bi-check2 text-emerald-400' : 'bi-share'}`}></i>
                  <span>{isCopied ? 'Copied Link!' : 'Share'}</span>
                </button>
                <a
                  href="/placeorder.html"
                  className="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-gradient-to-r from-emerald-500 to-emerald-600 hover:from-emerald-400 hover:to-emerald-500 text-charcoal-950 font-bold text-xs sm:text-sm tracking-wide shadow-lg shadow-emerald-500/25 transition-all transform hover:-translate-y-0.5"
                >
                  <i className="fa-solid fa-bolt"></i>
                  <span>Get Team Quote</span>
                </a>
              </div>
            </div>
          </header>

          {/* =============================================================== */}
          {/* 2. MAIN HERO SECTION (Split Left & Right Architecture) */}
          {/* =============================================================== */}
          <main className="relative z-10 flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 lg:py-12 flex flex-col justify-center">
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-12 items-center">

              {/* ------------------------------------------------------------- */}
              {/* LEFT COLUMN: BRANDING, HEADLINE, DETAILS & NAV CONTROLS */}
              {/* ------------------------------------------------------------- */}
              <div className="lg:col-span-5 flex flex-col justify-center space-y-6 lg:space-y-7">
                
                {/* 1. Small Uppercase Kicker Badge */}
                <div className="flex flex-wrap items-center gap-3">
                  <span className="inline-flex items-center gap-2 px-3 py-1 rounded-full text-[11px] font-extrabold tracking-widest uppercase bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">
                    <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    PREMIUM 7V7 COLLECTION
                  </span>
                  <span className="text-[11px] font-mono uppercase tracking-wider text-slate-400 font-semibold">
                    <i className="bi bi-shield-check text-emerald-400 me-1"></i> Pro Tournament Grade
                  </span>
                </div>

                {/* 2. Hero Headline */}
                <div>
                  <h1 className="font-display font-black text-4xl sm:text-5xl lg:text-6xl tracking-tight text-white leading-none">
                    BUILT TO <br />
                    <span className="bg-clip-text text-transparent bg-gradient-to-r from-emerald-400 via-emerald-300 to-volt-lime">
                      DOMINATE.
                    </span>
                  </h1>
                  <p className="mt-4 text-slate-300 text-sm sm:text-base leading-relaxed max-w-xl">
                    Engineered with tournament-grade four-way compression fabric, high-velocity aerodynamic moisture mapping, and zero-fade sublimated graphics for uncompromising elite football dominance.
                  </p>
                </div>

                {/* 3. Active Angle Dynamic Info Card */}
                <div className="p-4 sm:p-5 rounded-2xl glass-card border border-white/10 relative overflow-hidden transition-all duration-300">
                  <div className="absolute top-0 right-0 w-32 h-32 bg-emerald-500/5 rounded-full blur-2xl pointer-events-none"></div>

                  <div className="flex items-center justify-between border-b border-white/5 pb-3 mb-3">
                    <div className="flex items-center gap-2.5">
                      <span className="w-2 h-2 rounded-full bg-volt-lime animate-ping"></span>
                      <span className="font-mono text-xs font-bold text-volt-lime tracking-widest uppercase">
                        {activeView.label}
                      </span>
                    </div>
                    {/* View index counter */}
                    <div className="font-mono text-xs text-slate-400">
                      <span className="text-white font-bold text-sm">{activeView.shortCode}</span>
                      <span> / 06</span>
                    </div>
                  </div>

                  <p className="text-xs sm:text-sm text-slate-300 leading-normal mb-3">
                    {activeView.desc}
                  </p>

                  {/* Garment Technical Specs Panel */}
                  <div className="grid grid-cols-2 gap-2 text-[11px] pt-2 border-t border-white/5 font-mono">
                    <div className="flex items-center gap-1.5 text-slate-400">
                      <span className="text-slate-500">Colour:</span>
                      <span className="text-emerald-300 font-semibold flex items-center gap-1">
                        <span className="w-2 h-2 rounded-full bg-emerald-500 inline-block"></span> Emerald Green
                      </span>
                    </div>
                    <div className="flex items-center gap-1.5 text-slate-400">
                      <span className="text-slate-500">Number:</span>
                      <span className="text-white font-semibold">07 Championship</span>
                    </div>
                    <div className="flex items-center gap-1.5 text-slate-400">
                      <span className="text-slate-500">Category:</span>
                      <span className="text-white font-semibold">7v7 Football</span>
                    </div>
                    <div className="flex items-center gap-1.5 text-slate-400">
                      <span className="text-slate-500">Fabric:</span>
                      <span className="text-white font-semibold">Poly-Spandex 280G</span>
                    </div>
                  </div>
                </div>

                {/* 4. Action CTAs */}
                <div className="flex flex-wrap items-center gap-4 pt-1">
                  <a
                    href="/catalogue.html?category=7v7"
                    className="inline-flex items-center justify-center gap-2.5 px-6 sm:px-7 py-3.5 rounded-xl bg-gradient-to-r from-emerald-500 via-emerald-400 to-volt-lime text-charcoal-950 font-bold text-sm tracking-wide shadow-xl shadow-emerald-500/20 hover:shadow-emerald-500/40 transform hover:-translate-y-0.5 transition-all"
                  >
                    <span>EXPLORE COLLECTION</span>
                    <i className="fa-solid fa-arrow-right text-xs"></i>
                  </a>
                  <a
                    href="/customizer.html"
                    className="inline-flex items-center justify-center gap-2 px-5 sm:px-6 py-3.5 rounded-xl glass-card text-white hover:text-emerald-400 font-semibold text-sm border border-white/15 hover:border-emerald-500/40 transition-all"
                  >
                    <i className="fa-solid fa-sliders text-xs text-emerald-400"></i>
                    <span>CUSTOMIZE NOW</span>
                  </a>
                </div>

                {/* 5. Navigation Controls: Prev, Next & Interactive Thumbnail Indicators */}
                <div className="pt-3 border-t border-white/5 flex flex-wrap items-center justify-between gap-4">
                  {/* Prev / Next Buttons */}
                  <div className="flex items-center gap-2">
                    <button
                      onClick={handlePrev}
                      className="w-11 h-11 rounded-xl glass-card border border-white/10 hover:border-emerald-500/50 flex items-center justify-center text-slate-300 hover:text-white transition-all transform active:scale-95 group"
                      title="Previous View (Left Arrow)"
                      aria-label="Previous View"
                    >
                      <i className="bi bi-chevron-left group-hover:-translate-x-0.5 transition-transform text-sm"></i>
                    </button>
                    <button
                      onClick={handleNext}
                      className="w-11 h-11 rounded-xl glass-card border border-white/10 hover:border-emerald-500/50 flex items-center justify-center text-slate-300 hover:text-white transition-all transform active:scale-95 group"
                      title="Next View (Right Arrow)"
                      aria-label="Next View"
                    >
                      <i className="bi bi-chevron-right group-hover:translate-x-0.5 transition-transform text-sm"></i>
                    </button>
                    <span className="text-xs font-mono text-slate-400 ms-2">
                      <span className="text-white font-bold">{activeView.shortCode}</span> / 06
                    </span>
                  </div>

                  {/* 6 View Selector Dots / Pills */}
                  <div className="flex items-center gap-1.5">
                    {RASHGUARD_VIEWS.map((v, idx) => (
                      <button
                        key={v.id}
                        onClick={() => setActiveIndex(idx)}
                        className={`h-2 rounded-full transition-all duration-300 ${
                          idx === activeIndex
                            ? 'w-7 bg-emerald-400 shadow-md shadow-emerald-400/50'
                            : 'w-2 bg-slate-700 hover:bg-slate-500'
                        }`}
                        title={v.name}
                        aria-label={v.name}
                      />
                    ))}
                  </div>
                </div>

              </div>

              {/* ------------------------------------------------------------- */}
              {/* RIGHT COLUMN: 3D ORBITAL CIRCULAR PRODUCT SHOWCASE */}
              {/* ------------------------------------------------------------- */}
              <div className="lg:col-span-7 relative flex items-center justify-center">
                {/* 3D Canvas with all 6 Textured Planes in circular orbit */}
                <RashguardOrbitalCanvas
                  activeIndex={activeIndex}
                  onSelectIndex={setActiveIndex}
                  isAutoSpin={isAutoSpin}
                  onToggleAutoSpin={handleToggleAutoSpin}
                />
              </div>

            </div>
          </main>

          {/* =============================================================== */}
          {/* 3. BOTTOM THUMBNAIL QUICK-SWITCH BAR */}
          {/* =============================================================== */}
          <footer className="relative z-20 w-full border-t border-white/5 bg-charcoal-950/80 backdrop-blur-md py-4">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex items-center justify-between gap-4 overflow-x-auto pb-1 sm:pb-0 scrollbar-none">
                <span className="hidden sm:inline-flex items-center gap-2 text-xs font-mono uppercase tracking-widest text-slate-400 font-bold shrink-0">
                  <i className="bi bi-layers text-emerald-400"></i> All 6 Angles:
                </span>

                <div className="flex items-center gap-2.5 sm:gap-3 w-full sm:w-auto justify-start sm:justify-end">
                  {RASHGUARD_VIEWS.map((view, idx) => {
                    const isActive = idx === activeIndex;
                    return (
                      <button
                        key={view.id}
                        onClick={() => setActiveIndex(idx)}
                        className={`group flex items-center gap-2 px-3 py-1.5 rounded-xl text-xs font-semibold transition-all shrink-0 border ${
                          isActive
                            ? 'bg-emerald-500/15 border-emerald-500/60 text-white shadow-lg shadow-emerald-500/15'
                            : 'glass-card border-white/5 text-slate-400 hover:text-white hover:border-white/20'
                        }`}
                      >
                        <span className={`w-1.5 h-1.5 rounded-full ${isActive ? 'bg-volt-lime' : 'bg-slate-600 group-hover:bg-slate-400'}`}></span>
                        <span className="font-mono text-[10px] text-slate-500 font-bold">{view.shortCode}</span>
                        <span>{view.name}</span>
                      </button>
                    );
                  })}
                </div>
              </div>
            </div>
          </footer>

        </div>
      );
    }

    // Mount the Application
    ReactDOM.createRoot(document.getElementById('root')).render(<RashguardShowcaseApp />);
  </script>
</body>
</html>
