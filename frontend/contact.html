<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Prosix Sports</title>
  <link rel="icon" type="image/png" href="assets/images/logo-black.png">

  <!-- CSS Dependencies -->
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/all.min.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Announcement Bar -->
  

        <!-- Contact Form (Right) -->
        <div class="col-lg-7">
          <div class="p-4 p-md-5 bg-white border rounded-4 shadow-sm">
            <h3 class="fw-bold mb-4 text-uppercase">Send Us A Message</h3>
            <form onsubmit="event.preventDefault(); CartStore.showToast('Thank you! Your message has been sent.'); this.reset();">
              <div class="row g-3 mb-3">
                <div class="col-md-6">
                  <label class="form-label small fw-bold text-uppercase">Your Name *</label>
                  <input type="text" class="form-control form-control-lg" placeholder="Coach Sarah" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label small fw-bold text-uppercase">Email *</label>
                  <input type="email" class="form-control form-control-lg" placeholder="sarah@team.com" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label small fw-bold text-uppercase">Phone / Mobile</label>
                  <input type="tel" class="form-control form-control-lg" placeholder="+1 (555) 000-0000">
                </div>
                <div class="col-md-6">
                  <label class="form-label small fw-bold text-uppercase">Sport / Topic</label>
                  <input type="text" class="form-control form-control-lg" placeholder="e.g. 7v7 Football Uniforms">
                </div>
                <div class="col-12">
                  <label class="form-label small fw-bold text-uppercase">Message *</label>
                  <textarea class="form-control" rows="5" placeholder="Let us know how we can help your program..." required></textarea>
                </div>
              </div>
              <button type="submit" class="btn btn-dark btn-lg px-5 py-3 rounded-pill fw-bold text-uppercase fs-5">
                Send Message
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="main-footer">
    <div class="full-container">
      <div class="footer-top"><img src="assets/images/logo-white.png" alt="Prosix Sports" style="height: 40px;"></div>
      <div class="footer-bottom"><p class="mb-0">&copy; 2026 Prosix Sports. All Rights Reserved.</p></div>
    </div>
  </footer>

  <!-- Slide-over Cart Drawer -->
  

  <div class="drawer-backdrop" id="drawerBackdrop"></div>

  <script src="js/bootstrap.bundle.min.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
